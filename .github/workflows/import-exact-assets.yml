name: Import Exact Submission Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-exact-assets.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone exact staging source
        run: git clone --depth 1 --branch zip-assets-exact https://github.com/RezaHarahap/Workflow-CI.git /tmp/assets
      - name: Copy exact ZIP assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'Membangun_model/breast_cancer_preprocessing'
          cp '/tmp/assets/Membangun_model/breast_cancer_preprocessing/metadata.json' 'Membangun_model/breast_cancer_preprocessing/metadata.json'
          cp '/tmp/assets/Membangun_model/breast_cancer_preprocessing/test.csv' 'Membangun_model/breast_cancer_preprocessing/test.csv'
          cp '/tmp/assets/Membangun_model/breast_cancer_preprocessing/train.csv' 'Membangun_model/breast_cancer_preprocessing/train.csv'
          cp '/tmp/assets/Membangun_model/screenshoot_artifak.jpg' 'Membangun_model/screenshoot_artifak.jpg'
          cp '/tmp/assets/Membangun_model/screenshoot_dashboard.jpg' 'Membangun_model/screenshoot_dashboard.jpg'
          mkdir -p 'Monitoring dan Logging/4.bukti monitoring Prometheus' 'Monitoring dan Logging/5.bukti monitoring Grafana'
          cp '/tmp/assets/Monitoring dan Logging/1.bukti_serving.jpg' 'Monitoring dan Logging/1.bukti_serving.jpg'
          cp '/tmp/assets/Monitoring dan Logging/2.prometheus.yml' 'Monitoring dan Logging/2.prometheus.yml'
          cp '/tmp/assets/Monitoring dan Logging/3.prometheus_exporter.py' 'Monitoring dan Logging/3.prometheus_exporter.py'
          cp '/tmp/assets/Monitoring dan Logging/4.bukti monitoring Prometheus/1.monitoring_requests.jpg' 'Monitoring dan Logging/4.bukti monitoring Prometheus/1.monitoring_requests.jpg'
          cp '/tmp/assets/Monitoring dan Logging/4.bukti monitoring Prometheus/2.monitoring_model_up.jpg' 'Monitoring dan Logging/4.bukti monitoring Prometheus/2.monitoring_model_up.jpg'
          cp '/tmp/assets/Monitoring dan Logging/4.bukti monitoring Prometheus/3.monitoring_latency.jpg' 'Monitoring dan Logging/4.bukti monitoring Prometheus/3.monitoring_latency.jpg'
          cp '/tmp/assets/Monitoring dan Logging/5.bukti monitoring Grafana/1.dashboard_reza_harahap.jpg' 'Monitoring dan Logging/5.bukti monitoring Grafana/1.dashboard_reza_harahap.jpg'
          cp '/tmp/assets/Monitoring dan Logging/5.bukti monitoring Grafana/2.monitoring_requests.jpg' 'Monitoring dan Logging/5.bukti monitoring Grafana/2.monitoring_requests.jpg'
          cp '/tmp/assets/Monitoring dan Logging/5.bukti monitoring Grafana/3.monitoring_latency.jpg' 'Monitoring dan Logging/5.bukti monitoring Grafana/3.monitoring_latency.jpg'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import exact binary evidence and datasets from uploaded ZIP' || true
          git push origin HEAD:main
